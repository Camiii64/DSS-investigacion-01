name: Build and deploy Node.js app to Azure Web App - api-mediconnect-2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install backend dependencies and package
        run: |
          cd src/backend
          npm install
          cd ../..
          zip -r node-app.zip src/backend/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact
        run: |
          unzip node-app.zip
          shopt -s dotglob
          cp -r src/backend/* .
          ls node_modules | head -5

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EF3C2C8C3AEC4F4A98B37623D3CBAE85 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B6E1824046304084A44C85B8C3BF50AE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A3C1D1E9873D41F990B4D030090CA981 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-mediconnect-2026'
          slot-name: 'Production'
          package: .
